<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente IA - Santos Pegasus Soluciones</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .chat-container { width: 100%; max-width: 700px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 80vh; overflow: hidden; }
        .chat-header { background: #1f2937; color: white; padding: 20px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 10px; max-width: 80%; line-height: 1.5; font-size: 0.95rem; }
        .user-message { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-message { background: #e5e7eb; color: #1f2937; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input-area { padding: 15px; border-top: 1px solid #e5e7eb; display: flex; gap: 10px; background: #fafafa; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; font-size: 1rem; }
        button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        .loading { display: none; color: #6b7280; font-style: italic; font-size: 0.85rem; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">📄 Agente IA - Santos Pegasus Soluciones</div>
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">¡Hola! Estoy listo para responder tus preguntas sobre el <b>Manual de Onboarding para Nuevos Desarrolladores</b>. ¿En qué te puedo ayudar?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Escribe tu pregunta aquí..." onkeydown="if(event.key==='Enter') askQuestion()">
            <button onclick="askQuestion()">Enviar</button>
        </div>
    </div>

    <script>
        async function askQuestion() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const question = input.value.trim();
            if (!question) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = question;
            chatBox.appendChild(userMsg);
            input.value = '';

            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message bot-message loading';
            loadingMsg.textContent = 'Consultando documento...';
            loadingMsg.style.display = 'block';
            chatBox.appendChild(loadingMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });
                const data = await response.json();
                loadingMsg.remove();

                const botMsg = document.createElement('div');
                botMsg.className = 'message bot-message';
                botMsg.textContent = data.answer;
                chatBox.appendChild(botMsg);
            } catch (error) {
                loadingMsg.remove();
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message bot-message';
                errorMsg.textContent = 'Ocurrió un error al conectar con el servidor.';
                chatBox.appendChild(errorMsg);
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
